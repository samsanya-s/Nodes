<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка с кнопками</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #cardContainer {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1050; /* Чтобы появлялось поверх контента */
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1049;
    }
  </style>
</head>
<body>
  <div class="container text-center mt-5">
    <button id="showCardBtn" class="btn btn-primary">Показать карточку</button>
  </div>

  <!-- Карточка -->
  <div class="overlay" id="overlay"></div>
  <div id="cardContainer" class="card shadow p-3">
    <div class="card-body text-center">
      <h5 class="card-title">Пример карточки</h5>
      <p class="card-text">Это пример текста внутри карточки.</p>
      <button class="btn btn-success me-2" id="button1">Кнопка 1</button>
      <button class="btn btn-danger" id="button2">Кнопка 2</button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("showCardBtn").addEventListener("click", function () {
      document.getElementById("overlay").style.display = "block";
      document.getElementById("cardContainer").style.display = "block";
    });

    document.getElementById("overlay").addEventListener("click", function () {
      document.getElementById("overlay").style.display = "none";
      document.getElementById("cardContainer").style.display = "none";
    });

    document.getElementById("button1").addEventListener("click", function () {
      alert("Вы нажали Кнопку 1");
    });

    document.getElementById("button2").addEventListener("click", function () {
      alert("Вы нажали Кнопку 2");
    });
  </script>
</body>
</html>
